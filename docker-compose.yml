services:
  backend-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: redermio_backend_php
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
      - backend_writable:/var/www/backend/writable
    environment:
      CI_ENVIRONMENT: "${CI_ENVIRONMENT:-development}"
      APP_BASE_URL: "${APP_BASE_URL:-http://localhost:8080/}"
    networks:
      - redermio

  backend-nginx:
    image: nginx:1.27-alpine
    container_name: redermio_backend_nginx
    depends_on:
      - backend-php
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/conf.d/backend.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - redermio

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: redermio_frontend
    working_dir: /app
    depends_on:
      - backend-nginx
    ports:
      - "${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NG_CLI_ANALYTICS: "false"
      FRONTEND_API_URL: "${FRONTEND_API_URL:-http://localhost:8080/api}"
    networks:
      - redermio

  db:
    image: postgres:16-alpine
    container_name: redermio_db
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-redermio}"
      POSTGRES_USER: "${POSTGRES_USER:-redermio}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-redermio}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redermio

volumes:
  postgres_data:
  backend_writable:
  frontend_node_modules:

networks:
  redermio:
    driver: bridge
