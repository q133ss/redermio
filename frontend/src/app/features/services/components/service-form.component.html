<form class="service-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form-grid">
    <label class="field">
      <span>Название услуги</span>
      <input type="text" formControlName="name" />
      @if (getFieldError('name'); as error) {
        <small class="field-error">{{ error }}</small>
      }
    </label>

    <label class="field">
      <span>Описание</span>
      <textarea rows="5" formControlName="description"></textarea>
      @if (getFieldError('description'); as error) {
        <small class="field-error">{{ error }}</small>
      }
    </label>

    <label class="checkbox-field">
      <input type="checkbox" formControlName="is_active" />
      <span>Услуга активна</span>
    </label>
  </div>

  <div class="form-actions">
    <button type="submit" class="submit-button">{{ submitLabel() }}</button>
    <button type="button" class="cancel-button" (click)="cancel()">Отмена</button>
  </div>
</form>
